services:
  - type: web
    name: vyaparai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11

      - key: GEMINI_API_KEY
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: DATABASE_NAME
        value: vyaparai

      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256